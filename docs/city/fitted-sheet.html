<!doctype html>
<html><head><meta charset="utf-8"><title>Fitted store sheet</title>
<!-- Codex's retail fixtures (inferred-interiors/retail-fixtures.mjs) as a fitted store draws them,
     stocked through the City's hook (view.mjs kerbsideStockShelf) when ?real=1 (default) or with
     the engine's stand-in packs (?real=0). -->
<style>html,body{margin:0;height:100%;background:#222}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three-0.160.0/three.module.min.js","three/addons/":"../vendor/three-0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { objectKit } from "./objects.mjs";
import { itemSize, stockShelves } from "./shelf-stock.mjs";
import { aisleMap } from "./aisles.mjs";
import { retailFixture } from "../inferred-interiors/retail-fixtures.mjs";
const q = new URLSearchParams(location.search);
const O = await (await fetch("objects.json")).json(), R = await (await fetch("rules.json")).json();
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const kit = objectKit(THREE, { loadModel: (u) => loader.loadAsync(u), asset: (p) => "../" + p }, O, R);
const aisles = aisleMap(R), pending = [];
const MAP = { produce: ["produce"], dairy: ["dairy"], meat_and_deli: ["meat_seafood"], frozen: ["frozen"], drinks: ["drinks"], pantry: ["pantry", "condiments", "spices"], cereal_and_snacks: ["breakfast", "snacks"], checkout: ["checkout"] };
if (q.get("real") !== "0") globalThis.kerbsideStockShelf = (parent, shelves, { section }) => {
  const sizeOf = (x) => itemSize(O, R, x), ids = R.stores.kinds.grocery.items.filter((x) => (MAP[section] || ["pantry"]).includes(aisles.aisleOf[x]) && sizeOf(x));
  const placed = stockShelves({ shelves }, { [section]: ids }, sizeOf, (x) => aisles.displayOf[x], { cap: 360 });
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), V = new THREE.Vector3(), S = new THREE.Vector3(1, 1, 1);
  for (const [sku, list] of placed) pending.push(kit.instanced(sku, list.length, "low").then((st) => {
    if (!st) return; list.forEach((p, k) => { E.set(0, p.yaw, 0); Q.setFromEuler(E); st.set(k, M.compose(V.set(p.x, p.y, p.z), Q, S)); }); st.count(list.length); parent.add(st.group);
  }));
  return placed.size > 0;
};
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b2b2b);
scene.add(new THREE.HemisphereLight(0xf4f6f8, 0x6b6157, 1.6)); const sun = new THREE.DirectionalLight(0xfff6e8, 1.2); sun.position.set(3, 8, 6); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 12).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xcfcabd })); scene.add(floor);
const style = { wood: "#aa8867", accent: "#ac3834", label: "Supermarket" };
const rows = (ys, form = "packs") => ys.map((y) => ({ bottom_m: y, form }));
const F = [
  { role: "gondola_shelf", size_m: [0.95, 1.65, 3.6], stock: rows([0.15, 0.5, 0.85, 1.2]), section: "pantry", at: [-7, 0] },
  { role: "produce_bin", size_m: [0.95, 1.15, 3.0], stock: [], section: "produce", at: [-5, 0] },
  { role: "refrigerated_case", size_m: [2.4, 2.05, 0.82], stock: rows([0.3, 0.7, 1.1, 1.5]), section: "dairy", at: [-2, -1.5] },
  { role: "freezer_case", size_m: [2.4, 2.05, 0.82], stock: rows([0.3, 0.7, 1.1, 1.5]), section: "frozen", at: [0.8, -1.5] },
  { role: "checkout_lane", size_m: [0.85, 1.05, 2.2], stock: [], section: "checkout", at: [3.5, 0] },
  { role: "self_checkout", size_m: [0.85, 1.05, 1.0], stock: [], section: "checkout", at: [5.2, 0] },
];
for (const f of F) { const g = new THREE.Group(); g.position.set(f.at[0], 0, f.at[1]); scene.add(g); retailFixture(THREE, g, { ...f, id: f.role }, style); }
await Promise.all(pending);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
const v = (q.get("cam") || "-1,3.2,5.5,-1,0.9,-0.5").split(",").map(Number); cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]);
renderer.render(scene, cam); document.title = "ready";
</script></body></html>
