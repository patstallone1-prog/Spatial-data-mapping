<!doctype html>
<html><head><meta charset="utf-8"><title>Climb sheet</title>
<!-- The city's climbing on its own: the walker's figure on a fence, a wall, a rock or a tree, moved
     by climb-motion.mjs and bent by climb-pose.mjs exactly as in the game. Arrows climb (Up, Down,
     Left, Right, two together for a diagonal). ?face=chainlink|board|picket|wall|rock|tree
     ?h=2.4 (height, m) ?auto=up|down|across (climbs by itself) ?t=seconds (run on, then hold: for
     screenshots) ?view=side|front|back -->
<style>body{margin:0;background:#cfd6da;font:12px system-ui;overflow:hidden}#hud{position:fixed;left:8px;top:8px;background:#fffd;padding:6px 8px;border-radius:6px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"../vendor/three-0.160.0/three.module.min.js","three/addons/":"../vendor/three-0.160.0/examples/jsm/"}}</script>
</head><body><div id="hud">loading…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { createMechanics } from "./mechanics.mjs";
import { createClimbing } from "./climbing.mjs";
import { createClimbMotion } from "./climb-motion.mjs";
import { bodyFromRig, createLimbIK, faceFrame, limbBones, poseClimber } from "./climb-pose.mjs";
import { faceOf, holdsOf } from "./climb-route.mjs";
const q = new URLSearchParams(location.search), kind = q.get("face") || "chainlink", H = +(q.get("h") || (kind === "rock" ? 4 : kind === "tree" ? 3.2 : kind === "wall" ? 2.3 : 2.2));
const hud = document.getElementById("hud");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd6da);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667766, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 6, 4); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshLambertMaterial({ color: 0x8a9a7a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const M = createMechanics(await (await fetch("../object-catalogue.json")).json()), C = createClimbing(M);
// The thing: its face toward +z (the climber's side), its foot at z = 0.
const T = kind === "wall" ? 0.35 : kind === "rock" ? 1.5 : kind === "tree" ? 0.4 : 0.04;
const spec = { kind, height_m: H, thickness_m: T, key: `sheet-${kind}`, u0: kind === "tree" ? -0.2 : -3, u1: kind === "tree" ? 0.2 : 3 };
const face = faceOf(spec);
const colour = { chainlink: 0x9aa3a8, board: 0x8a6a48, picket: 0xe8e4da, wall: 0xa0563e, rock: 0x8d8a83, tree: 0x5b4636 }[kind] || 0x999999;
const thing = kind === "tree" ? new THREE.Mesh(new THREE.CylinderGeometry(T / 2, T / 2 * 1.1, H + 2, 20), new THREE.MeshLambertMaterial({ color: colour }))
  : new THREE.Mesh(new THREE.BoxGeometry(6, H, T), new THREE.MeshLambertMaterial({ color: colour, transparent: kind === "chainlink", opacity: kind === "chainlink" ? 0.55 : 1 }));
thing.position.set(0, (kind === "tree" ? H + 2 : H) / 2, -T / 2); thing.castShadow = thing.receiveShadow = true; scene.add(thing);
// The holds, drawn small.
for (const h of holdsOf(face, -1.2, 1.2)) {
  if (kind === "chainlink" && (Math.round(h.u * 10) % 2 || Math.round(h.v / 0.12) % 2)) continue;
  const d = new THREE.Mesh(new THREE.SphereGeometry(h.top ? 0.018 : 0.012, 6, 4), new THREE.MeshBasicMaterial({ color: h.top ? 0xffcc00 : h.kind === "jug" ? 0x2a9d4a : h.kind === "sloper" ? 0x3a6ad0 : 0xd04a3a }));
  d.position.set(h.u, h.v, kind === "tree" ? 0.02 : 0.01); scene.add(d);
}
const F = faceFrame(THREE, new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 1));
const gltf = await new GLTFLoader().loadAsync("https://threejs.org/examples/models/gltf/Soldier.glb");
// The Soldier faces -z in its file; the game turns it round in a holder so the walker's +z is ahead.
const avatar = new THREE.Group(); gltf.scene.rotation.y = Math.PI; avatar.add(gltf.scene);
gltf.scene.traverse((o) => { if (o.isMesh) o.castShadow = true; });
scene.add(avatar);
const mixer = new THREE.AnimationMixer(gltf.scene); const idle = gltf.animations.find((a) => /idle/i.test(a.name)) || gltf.animations[0]; mixer.clipAction(idle).play(); mixer.update(0);
const B = limbBones(avatar), ik = createLimbIK(THREE);
avatar.updateMatrixWorld(true);
const body = bodyFromRig(THREE, avatar, B), hipRest = body.hip_rest_m;
const climber = { kg: 75, strength: 20, hands: "skin", feet: "shoe_rubber" };
let motion = createClimbMotion({ face: spec, C, climber, body });
const held = new Set();
addEventListener("keydown", (e) => { if (e.key.startsWith("Arrow")) { held.add(e.key); e.preventDefault(); } });
addEventListener("keyup", (e) => held.delete(e.key));
let auto = q.get("auto"); const until = q.get("t") ? +q.get("t") : Infinity;
let clock = 0, log = [];
const viewOf = q.get("view") || "side";
let forced = null;
function frame(dtForce = null) {
  const dt = dtForce ?? (clock < until ? 1 / 60 : 0);
  clock += dt;
  let dir = { u: (held.has("ArrowRight") ? 1 : 0) - (held.has("ArrowLeft") ? 1 : 0), v: (held.has("ArrowUp") ? 1 : 0) - (held.has("ArrowDown") ? 1 : 0) };
  if (auto === "up") dir = { u: 0, v: 1 }; if (auto === "down") dir = { u: 0, v: -1 }; if (auto === "across") dir = { u: 1, v: clock < 3 ? 1 : 0 };
  if (dt) {
    mixer.update(dt);
    for (const ev of motion.step(dt, dir)) {
      log.push(ev.kind + (ev.reason ? `: ${ev.reason}` : "")); log = log.slice(-6);
      if (ev.kind === "over") motion.crossTo({ ...spec, key: spec.key + ":far" }, ev.u);
    }
  }
  const f = motion.frame();
  // On the far side the frame is turned round: the far face, out toward -z past the thickness.
  const FF = motion.face.key.endsWith(":far") ? faceFrame(THREE, new THREE.Vector3(0, 0, -T), new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 0, -1)) : F;
  const short = q.get("pose") === "0" ? {} : poseClimber(THREE, avatar, B, ik, FF, f, hipRest, body.hip_bone_m);
  const at = B.hips.getWorldPosition(new THREE.Vector3());
  const cam = viewOf === "front" ? new THREE.Vector3(0.4, 1.2, 3.2) : viewOf === "back" ? new THREE.Vector3(0.3, 1.4, -3.2) : new THREE.Vector3(2.6, 1.3, 1.6);
  camera.position.copy(at).add(cam); camera.lookAt(at.x, at.y + 0.2, at.z);
  hud.textContent = `${kind} ${H} m · ${motion.phase}${motion.busy ? " (moving)" : ""}\nhips u ${f.hip.u.toFixed(2)} v ${f.hip.v.toFixed(2)} out ${f.hip.out.toFixed(2)}\nshort: ${Object.entries(short).map(([k, s]) => `${k} ${(s * 100).toFixed(0)}cm`).join(" ")}\n${log.join("\n")}`;
  if (renderer.domElement.width !== innerWidth || renderer.domElement.height !== innerHeight) { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / Math.max(1, innerHeight); camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  if (dtForce === null) requestAnimationFrame(() => frame());
}
window.sheet = { setAuto: (a) => { auto = a; }, motion, avatar, B, THREE, scene, body, get clock() { return clock; },
  //: Run on ``seconds`` of the climb at once (60 steps a second) and draw the last frame.
  advance(seconds) { for (let i = 0; i < Math.round(seconds * 60); i += 1) frame(1 / 60); return motion.frame(); } };
frame();
</script></body></html>
