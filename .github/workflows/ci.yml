# The build is held to what it measured last time.
#
# Three gates, and a merge to main needs all of them: ruff on the errors that matter (F, E7,
# B, RUF -- the long lines are reported but do not block), the test suite, and the corridor
# render audit against its committed baseline. The audit runs the renderer's own width and
# crossing rules over the committed payload in docs/ and tests/test_width_vs_kerb.py holds
# every figure to data/sf_corridor/audits/width_vs_kerb.json: a change may improve the numbers,
# and when it does the baseline is regenerated on purpose
# (`python scripts/audit_corridor_render.py --baseline`); it may not make them worse.
#
# Deploys happen from a green main only (tools/build_pages.py, run by hand after this passes).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      # Real errors: undefined names, unused imports, bugbear traps, semicolon-joined statements.
      - name: ruff (blocking)
        run: ruff check src tests scripts/build_terrain.py --ignore E501 --output-format github
      # Line length is reported, so the count is visible, but does not fail the build; the
      # renderer's embedded JavaScript has lines no formatter should touch.
      - name: ruff line length (report only)
        run: ruff check src tests --select E501 --statistics || true

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Validate published visual cells if present
        run: python scripts/publish_visual_pilot.py
      # The audit's baseline test (tests/test_width_vs_kerb.py) is its own job below so that a
      # failure there reads as "the render got worse", not as a test failure among 800.
      - run: pytest -q --ignore=tests/test_width_vs_kerb.py

  audit:
    name: render audit vs baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: audit the committed payload
        run: python scripts/audit_corridor_render.py > audit.json
      - name: hold it to the baseline
        run: pytest -q tests/test_width_vs_kerb.py
      - name: summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          r = json.load(open("audit.json")); b = json.load(open("data/sf_corridor/audits/width_vs_kerb.json"))
          w, c, x = r["widthVsKerb"], r["crosswalk"], r["crossSections"]
          print("| measure | this build | baseline |\n|---|---|---|")
          print(f"| width vs kerb, median abs (m) | {w['medianAbsM']:.3f} | {b['medianAbsM']:.3f} |")
          print(f"| ways enveloped by the city's kerbs | {w['enveloped']} | {b['enveloped']} |")
          print(f"| crossing legs on drawn kerb | {c['attachedShare']:.3f} | {b['crosswalkAttachedShare']:.3f} |")
          print(f"| crossing ends at a ramp corner | {c['endsAtRampShare']:.3f} | {b['crosswalkEndsAtRampShare']:.3f} |")
          print(f"| cross-section stations resolved | {x['resolvedShare']:.3f} | {b['crossSectionResolvedShare']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit.json
