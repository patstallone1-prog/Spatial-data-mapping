# Required check names stay stable. PRs and merges run only the tests selected from
# their diff; a manual full run is available without making every PR pay for it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every module instead of a changed-module plan
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: changed-module test plan
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      node: ${{ steps.select.outputs.node }}
      audit: ${{ steps.select.outputs.audit }}
      lint: ${{ steps.select.outputs.lint }}
      visual_publish: ${{ steps.select.outputs.visual_publish }}
    steps:
      # The selector reads only source files and pages (tools/ci/select_tests.py): the tree's
      # data (region JSON, land masks, the asset map; 2.3 of its 2.9 GB) is left out, which took
      # this checkout from about a minute to seconds. Plans were identical either way for every
      # recent PR (2026-11-02).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.py
            *.mjs
            *.js
            *.html
            /tests/
            /tools/
            /*.toml
            /*.cfg
            /*.ini
            /*.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select affected tests
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL" = true ]; then
            python tools/ci/select_tests.py --full --out test-plan.json
          else
            if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD^)"; fi
            python tools/ci/select_tests.py --base "$BASE" --out test-plan.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-module-test-plan
          path: test-plan.json
          if-no-files-found: error

  lint:
    name: ruff
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid test plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      # Ruff reads Python only.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.py
            /*.toml
      - uses: actions/download-artifact@v4
        with:
          name: changed-module-test-plan
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.lint == 'true'
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
        if: needs.plan.outputs.lint == 'true'
      - name: Lint changed Python modules
        run: python tools/ci/run_selected.py --plan test-plan.json --kind lint

  tests:
    name: pytest
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid test plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      # The whole tree only when something here runs (tests read region data); otherwise the
      # runner script alone, to report that nothing was affected.
      - uses: actions/checkout@v4
        if: needs.plan.outputs.python == 'true' || needs.plan.outputs.node == 'true' || needs.plan.outputs.visual_publish == 'true'
      - uses: actions/checkout@v4
        if: needs.plan.outputs.python != 'true' && needs.plan.outputs.node != 'true' && needs.plan.outputs.visual_publish != 'true'
        with:
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@v4
        with:
          name: changed-module-test-plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.python == 'true' || needs.plan.outputs.node == 'true'
        with:
          node-version: "22"
      - run: pip install -e ".[dev,interiors]"
        if: needs.plan.outputs.python == 'true' || needs.plan.outputs.visual_publish == 'true'
      - name: Validate affected published visual cells
        if: needs.plan.outputs.visual_publish == 'true'
        run: python scripts/publish_visual_pilot.py
      - name: Test changed Python modules and their consumers
        run: python tools/ci/run_selected.py --plan test-plan.json --kind python
      - name: Test changed JavaScript modules and their consumers
        run: python tools/ci/run_selected.py --plan test-plan.json --kind node

  audit:
    name: render audit vs baseline
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid test plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@v4
        if: needs.plan.outputs.audit == 'true'
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.audit == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.audit == 'true'
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
        if: needs.plan.outputs.audit == 'true'
      - name: Audit the affected corridor renderer
        if: needs.plan.outputs.audit == 'true'
        run: |
          python scripts/audit_corridor_render.py > audit.json
          python -m pytest -q tests/test_width_vs_kerb.py
      - name: Unaffected audit
        if: needs.plan.outputs.audit != 'true'
        run: echo 'No corridor-audit dependency changed; no render audit launched.'
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.audit == 'true'
        with:
          name: audit-report
          path: audit.json
