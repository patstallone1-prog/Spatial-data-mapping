# The independent fail-safe: every 30 minutes, outside the controller and outside the Mac.
#
# If the controller has not answered /healthz for an hour, or any worker instance is older than
# 30 hours, those instances are deleted (smc-cloud watchdog). It touches only instances the
# system labelled as its own (Hetzner kerbside=worker; RunPod pods named kw-...). A controller
# that stopped its own pod for want of work is started again when the queue it backed up has
# work the budget allows (cli.wake_controller).
#
# Off until the repository variable KERBSIDE_CLOUD_ENABLED is "true" and the secrets below
# exist (cloud/docs/secrets.md): it never runs against accounts that are not set up.
name: cloud-watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    if: vars.KERBSIDE_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[cloud]"
      - name: watchdog
        env:
          KERBSIDE_SECRET: ${{ secrets.KERBSIDE_SECRET }}
          KERBSIDE_OPS_TOKEN: ${{ secrets.KERBSIDE_OPS_TOKEN }}
          # The controller pod's proxy address, https://<pod id>-8080.proxy.runpod.net.
          KERBSIDE_CONTROLLER_URL: ${{ vars.KERBSIDE_CONTROLLER_URL }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_PRIVATE_BUCKET: ${{ vars.S3_PRIVATE_BUCKET || 'kerbside' }}
          S3_PRIVATE_ACCESS_KEY_ID: ${{ secrets.S3_PRIVATE_ACCESS_KEY_ID }}
          S3_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.S3_PRIVATE_SECRET_ACCESS_KEY }}
          S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET || 'kerbside-finished-map' }}
          S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE }}
          # The watchdog never writes the public bucket: it is handed no key that could.
          S3_PUBLIC_ACCESS_KEY_ID: ${{ secrets.S3_PRIVATE_ACCESS_KEY_ID }}
          S3_PUBLIC_SECRET_ACCESS_KEY: ${{ secrets.S3_PRIVATE_SECRET_ACCESS_KEY }}
        run: smc-cloud watchdog --config cloud/config/kerbside-cloud.toml --grace-min 60 --max-hours 30
