<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kerbfront Building Studio</title>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
:root{--bg:#f1efe8;--panel:#fbfaf6;--ink:#1f2a26;--muted:#5e6b64;--line:#d5d6cb;--accent:#245a46;--sel:#e2732b;--warn:#a3302b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,sans-serif;display:grid;grid-template-rows:48px 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:#18392f;color:#f3f1ea}
header h1{font-size:15px;margin:0 12px 0 0;font-weight:650;letter-spacing:.01em;white-space:nowrap}
header select,header button{font:inherit;border-radius:5px;border:1px solid #3c6656;background:#244a3d;color:#f3f1ea;padding:5px 9px;cursor:pointer}
header button:hover{background:#2f5c4c}header button.on{background:#e8e3d4;color:#18392f}
header .sp{flex:1}#status{font-size:12px;color:#c5d6cb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
main{display:grid;grid-template-columns:300px 1fr 340px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
section{padding:10px 12px;border-bottom:1px solid var(--line)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.row{display:grid;grid-template-columns:110px 1fr;gap:6px;align-items:center;margin:4px 0}
.row label{color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:#fff;color:var(--ink)}
input[type=color]{padding:0;height:26px}input[type=checkbox]{width:auto}
button.tool{font:inherit;border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 8px;margin:2px 2px 2px 0;cursor:pointer}
button.tool:hover{border-color:var(--accent)}button.danger{color:var(--warn)}
.tree div{padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree div:hover{background:#eceae1}.tree div.on{background:#f8e2d1;color:#7a3910}
.tree .k{color:var(--muted);font-size:11px;margin-right:4px}
.facts{font-size:12px;color:var(--muted)}.facts b{color:var(--ink);font-weight:600}
.ev{font-size:11px;color:var(--muted);background:#f0eee6;border-radius:4px;padding:4px 6px;margin-top:6px;word-break:break-word}
.stage{position:relative;display:grid;grid-template-rows:1fr 230px;min-height:0}
#view{position:relative;min-height:0;overflow:hidden;background:#c9d7dc}
#view canvas{position:absolute;inset:0;width:100%;height:100%}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;pointer-events:none}
#view.match #photo{display:block}
#view.compare{display:grid;grid-template-columns:1fr 1fr}
#view.compare #photo{display:block;position:relative;object-fit:contain;background:#222}
#view.compare canvas{position:relative}
#elev{background:#fbfaf6;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr;grid-template-rows:30px 1fr;min-height:0}
#elevbar{display:flex;align-items:center;gap:4px;padding:2px 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
#elevbar b{color:var(--ink);margin-right:8px}
#elevsvg{width:100%;height:100%;display:block;user-select:none}
.matchbar{position:absolute;left:10px;bottom:10px;background:#fbfaf6ee;border-radius:6px;padding:8px 10px;box-shadow:0 2px 10px #0002;display:none;font-size:12px;width:330px}
#view.match .matchbar,#view.compare .matchbar{display:block}
#view.compare .matchbar{left:auto;right:10px}
.hint{font-size:11px;color:var(--muted)}
body.bare{grid-template-rows:1fr}body.bare header,body.bare aside,body.bare #elev,body.bare .matchbar{display:none!important}
body.bare main{grid-template-columns:1fr}body.bare .stage{grid-template-rows:1fr}
@media (max-width:1100px){main{grid-template-columns:240px 1fr 280px}}
</style>
</head>
<body>
<header>
  <h1>Kerbfront Building Studio</h1>
  <select id="modelSel" aria-label="Model"></select>
  <button id="vStreet">Street</button><button id="vOrbit">Orbit</button><button id="vMatch">Photo match</button><button id="vCompare">Compare</button>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button id="save" title="Save to models/ (Ctrl+S)">Save</button>
  <span class="sp"></span><span id="status">Loading…</span>
</header>
<main>
  <aside id="left">
    <section><h2>Business</h2><div id="facts" class="facts"></div></section>
    <section><h2>Parts</h2><div id="tree" class="tree"></div></section>
  </aside>
  <div class="stage">
    <div id="view"><img id="photo" alt="Reference photograph"><canvas id="c"></canvas>
      <div class="matchbar" id="matchbar">
        <div class="row"><label>Photo</label><select id="photoSel"></select></div>
        <div class="row"><label>Model over photo</label><input id="opacity" type="range" min="0" max="1" step="0.05" value="0.5"></div>
        <div class="row"><label>Yaw / pitch</label><div style="display:flex;gap:4px"><input id="aYaw" type="number" step="0.5"><input id="aPitch" type="number" step="0.5"></div></div>
        <div class="row"><label>FOV / height</label><div style="display:flex;gap:4px"><input id="aFov" type="number" step="0.5"><input id="aZ" type="number" step="0.05"></div></div>
        <div class="row"><label>Shift x / y</label><div style="display:flex;gap:4px"><input id="aX" type="number" step="0.1"><input id="aY" type="number" step="0.1"></div></div>
        <div class="hint" id="photoInfo"></div>
      </div>
    </div>
    <div id="elev"><div id="elevbar"></div><svg id="elevsvg"></svg></div>
  </div>
  <aside id="right"><section><h2 id="inspTitle">Inspector</h2><div id="insp"></div></section></aside>
</main>
<script type="module" src="editor.mjs"></script>
</body>
</html>
