<!doctype html><meta charset="utf-8"><title>Kerbside returning-visitor cache check</title>
<style>body{font:16px system-ui;background:#f7f6ef;color:#20271f;margin:32px;max-width:950px}button{padding:12px;margin:5px;background:#8c844c;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px}</style>
<h1>Returning-visitor upgrade check</h1>
<p>This localhost-only fixture uses synthetic data. It does not touch production captures.</p>
<button id="seed">1. Seed old worker and stored world</button>
<button id="upgrade">2. Upgrade to current worker</button>
<button id="audit">3. Verify returning visit</button>
<pre id="result">Ready to test</pre>
<script>
const OLD='kerbside-0123456789abcdef',result=document.getElementById('result');
let priorController=navigator.serviceWorker.controller?.scriptURL;
const report=value=>result.textContent=JSON.stringify(value,null,2);
async function register(script){
 const registration=await navigator.serviceWorker.register(script,{scope:'/',updateViaCache:'none'});
 await registration.update();
 const worker=registration.installing||registration.waiting||registration.active;
 if(worker.state!=='activated')await new Promise((resolve,reject)=>{
   worker.addEventListener('statechange',()=>{if(worker.state==='activated')resolve();if(worker.state==='redundant')reject(Error('Worker failed'));});
 });
 if(navigator.serviceWorker.controller?.scriptURL!==new URL(script,location.href).href)
   await new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));
}
async function capture(value){
 const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('kerbside-cache-qa',1);
   r.onupgradeneeded=()=>r.result.createObjectStore('captures');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
 return new Promise((resolve,reject)=>{const t=db.transaction('captures',value?'readwrite':'readonly');
   const r=value?t.objectStore('captures').put(value,'sentinel'):t.objectStore('captures').get('sentinel');
   r.onsuccess=()=>{const found=r.result;t.oncomplete=()=>{db.close();resolve(found);};};t.onerror=()=>reject(t.error);});
}
document.getElementById('seed').onclick=async()=>{try{
 await register('/__legacy_cache_qa__.js');
 const cache=await caches.open(OLD);await cache.put('/__cache_qa_data__.json',new Response('{"revision":"stale"}'));
 await caches.open('kerbside-captures');await caches.open('unrelated-test-cache');
 await capture('synthetic capture preserved');
 const data=await fetch('/__cache_qa_data__.json').then(r=>r.json());
 report({phase:'old worker',revision:data.revision,cacheNames:await caches.keys(),capture:await capture()});
}catch(e){report({error:e.message});}};
document.getElementById('upgrade').onclick=async()=>{try{
 await register('/sw.js');
 report({phase:'upgraded',controller:navigator.serviceWorker.controller?.scriptURL,cacheNames:await caches.keys(),capture:await capture()});
}catch(e){report({error:e.message});}};
document.getElementById('audit').onclick=async()=>{try{
 const revision=(await fetch('/__cache_qa_data__.json').then(r=>r.json())).revision;
 for(const suffix of ['?from=home','?v=one','?v=two'])await fetch('/app.html'+suffix);
 const names=await caches.keys(),shells=names.filter(n=>n.startsWith('kerbside-shell-'));
 const entries=shells.length?(await (await caches.open(shells[0])).keys()).map(r=>new URL(r.url).pathname):[];
 const saved=await capture();
 const pass=revision==='network'&&!names.includes(OLD)&&shells.length===1&&entries.length===7
   &&saved==='synthetic capture preserved'&&names.includes('unrelated-test-cache')&&names.includes('kerbside-captures');
 report({pass,phase:'returning visitor',revision,controller:navigator.serviceWorker.controller?.scriptURL,
   shellFiles:entries.length,entries,unrelatedCachesPreserved:true,capture:saved});
}catch(e){report({error:e.message});}};
</script>
