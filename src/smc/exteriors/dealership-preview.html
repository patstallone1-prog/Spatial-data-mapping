<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kerbside · Dealership design lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e7df;color:#23362e;font:14px/1.5 system-ui,sans-serif}header{height:74px;padding:14px 24px;background:#193b32;color:#f1f1e8;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:20px}header small{color:#c7d5c8}main{height:calc(100vh - 74px);display:grid;grid-template-columns:300px 1fr}aside{background:#faf8f0;padding:20px;overflow:auto;border-right:1px solid #ced4c9}label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px}select,button{width:100%;font:inherit;color:#244638;background:white;border:1px solid #b1beb0;border-radius:5px;padding:8px}button{margin-top:8px;cursor:pointer;background:#e2eadb}button:hover{background:#d0e0c6}.toggle{display:flex;gap:8px;align-items:center;margin-top:12px}.toggle label{margin:0;font-weight:400}p,li{font-size:12px}a{color:#285c48}ul{padding-left:17px}.stage{position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:none}.caption{position:absolute;bottom:20px;left:20px;max-width:680px;padding:12px 18px;background:#faf8f0ed;border-radius:5px;pointer-events:none;box-shadow:0 2px 12px #0002}.caption b{display:block;font-size:18px}.caption small{color:#52675b}#status{display:inline-block;background:#dbe6d4;border-radius:12px;padding:4px 9px;font-size:11px;margin:16px 0 0}#errors{white-space:pre-wrap;color:#a3282c}#stats{border-top:1px solid #d2d8cb;padding-top:12px}h2{font-size:14px;margin-top:20px}@media(max-width:800px){main{grid-template-columns:230px 1fr}aside{padding:12px}header small{display:none}}
@media(max-width:700px){main{display:flex;flex-direction:column;height:auto}aside{max-height:38vh;border-right:0;border-bottom:1px solid #ced4c9}.stage{height:62vh;min-height:320px}.caption{max-width:calc(100% - 32px);left:16px;bottom:16px}header{padding:10px 16px}header h1{font-size:17px}}
</style>
<header><div><h1>Kerbside · Dealership design lab</h1><small>Brand identity, source shells and parcel-aware circulation</small></div><small>Proposed layouts · Local review</small></header>
<main><aside><label for="case">Dealership / source lot</label><select id="case"></select>
<button id="overview">Site overview</button><button id="entrance">Street entrance</button><button id="showroom">Inside showroom</button><button id="service">Service approach</button>
<div class="toggle"><input id="roof" type="checkbox" checked><label for="roof">Show roof</label></div><div class="toggle"><input id="cars" type="checkbox" checked><label for="cars">Show display cars</label></div><div class="toggle"><input id="night" type="checkbox"><label for="night">Evening light</label></div>
<p><a href="index.html">Storefront chain library</a></p><span id="status">Loading layouts…</span><p id="stats"></p><p id="warnings"></p><p id="rejections"></p>
<h2>Design references</h2><ul id="sources"></ul><p id="errors" role="alert"></p></aside>
<div class="stage"><canvas id="view" tabindex="0" aria-label="Three dimensional dealership and vehicle lot"></canvas><div class="caption"><b id="name">Loading dealerships…</b><small>Drag to orbit · Scroll to move closer · Source parcel and building shapes retained</small></div></div></main>
<script type="module" src="dealership-preview.mjs"></script></html>
