# Kerbside cloud: the controller's settings. Committed; holds no secret. ``${NAME}`` is filled
# from the controller's environment (cloud/docs/secrets.md lists every variable).
#
# Everything runs on RunPod (the controller, CPU and GPU workers) and stores in AWS S3
# (2026-10-25; the Hetzner and R2 code paths remain, unused). Pool sizes and prices are a
# starting point (cloud/docs/costs.md). Re-measure with bench jobs once the first cells have
# run in the cloud, then adjust: the dashboard shows cost per finished stage.

pass_env = ["AWS_REGION", "S3_ENDPOINT_URL", "S3_PRIVATE_ACCESS_KEY_ID", "S3_PRIVATE_SECRET_ACCESS_KEY",
            "MAPILLARY_ACCESS_TOKEN", "MAPILLARY_TOKEN", "HUGGINGFACE_TOKEN"]

[controller]
# On RunPod this is left unset and the controller takes its own pod's proxy address,
# https://<pod id>-8080.proxy.runpod.net (controller.Config.load).
url = "${KERBSIDE_CONTROLLER_URL}"
# The pod's container disk; backed up to the private bucket every 5 minutes and restored by a
# restarted controller, so no paid volume is needed.
db = "/app/build/queue.sqlite"
root = "/app"
lease_ttl_s = 120
tick_s = 20
backup_s = 300
# The controller's own pod (cpu3c, 2 vCPU), charged to the budget below while it runs. Up all
# month it would be $45 on its own, so it stops itself after this many minutes with nothing it
# could do -- no worker, no ready job the budget allows -- and the watchdog (every 30 minutes,
# on GitHub) starts it again when there is (controller.housekeeping, cli.wake_controller).
hourly_usd = 0.063
sleep_after_min = 20
# The standing plan (smc-cloud plan --standing) is submitted again this often: new house
# batches, new interior batches, a chain that has grown.
replan_h = 24
# Kinds that wait (2026-10-28, the owner): the interior engine's house batches and restaurant
# rounds stand aside so the cells and the house exteriors finish first. Remove to resume.
paused_kinds = ["interior_batch", "restaurant_round"]
# Gates and publications at once on the controller: each mostly waits on the buckets. One at a
# time left 190 finished cells days from the site (2026-10-31).
control_slots = 4

# Cells stuck past anything a finished cell took are set aside (smc.cloud.stuck): a stage
# quarantined this long, or more worker time / wall time than the costliest finished cell by
# the margin. `smc-cloud defer CELL --undo` brings one back.
[controller.defer]
quarantined_after_h = 2
margin = 1.25
min_worker_h = 12
min_wall_h = 48

[stores]
private = "s3://${S3_PRIVATE_BUCKET}"   # kerbside: no public access at all
public = "s3://${S3_PUBLIC_BUCKET}"     # kerbside-finished-map: public read, CORS for the site
public_base = "${S3_PUBLIC_BASE}"       # its public address: a CloudFront domain, or the bucket's

# $5 a day, everything counted: workers, the controller's pod while it is up, and storage
# (2026-10-26: the owner wants the gap cells finished fast and tops up RunPod to match).
# A day stops launching at daily_usd and its workers drain (finish what they hold); the month
# stops launching at monthly_usd; hard_monthly_usd stops everything until the month turns.
# $5 is about 14 CPU-worker hours a day, some 15-20 cells.
# 2026-10-28: raised so the cells and houses finish as fast as the pools allow (the owner). A
# cell costs the same however many run at once; the daily limit only sets how many pods may.
# 2026-10-29: $60, above every pool at full ($1.92 CPU + $0.60 GPU + the controller, an hour),
# so the limit no longer slows the last cells (the owner). warn_usd: a warning (dashboard, and
# a failed watchdog run, which GitHub emails) once idle rented time has cost 50 cents in a day,
# or less than that is left of a budget.
[budget]
daily_usd = 60.0
monthly_usd = 300.0
hard_monthly_usd = 310.0
warn_usd = 0.5

# CPU: RunPod CPU pods. Terrain and lidar spend most of their time waiting on USGS (a cell's
# lidar: 221 minutes, 24 of them on the CPU, 450 MB), so eight vCPUs run twelve jobs at once. hourly_usd is an estimate kept on the high side (RunPod's
# console shows the live price); the budget counts with it, so a high guess only stops sooner.
[pools.cpu]
provider = "runpod"
instance_type = "cpu3g"
hourly_usd = 0.32
image = "ghcr.io/patstallone1-prog/kerbside-cpu:${KERBSIDE_IMAGE_TAG}"
# Six pods (72 jobs at once) while the budget allows; the scheduler launches only for ready work.
max_workers = 6
slots = 12
# Rented time always has work (2026-10-28, the owner): an idle pod goes after 3 minutes, jobs are
# packed onto the fewest pods (the emptiest stops leasing and is stopped once empty), and a
# second pod is rented only for 4 ready jobs of its own.
idle_minutes = 3
min_fill = 4
max_hours = 24
min_billed_hours = 0
# RunPod refuses a CPU pod's container disk over 80 GB.
disk_gb = 80
extra = { compute = "CPU", vcpus = 8, cloud_type = "SECURE", interruptible = false }

# GPU: the house pipeline, one batch at a time (its journals are one state; smc.cloud.stages).
# The A5000 is first choice; when none is free (2026-10-26: no secure stock) RunPod takes one of
# gpu_types, all 24-48 GB. hourly_usd is the dearest of them, so the budget never undercounts.
[pools.gpu]
provider = "runpod"
instance_type = "NVIDIA RTX A5000"
hourly_usd = 0.60
image = "ghcr.io/patstallone1-prog/kerbside-gpu:${KERBSIDE_IMAGE_TAG}"
max_workers = 1
slots = 1
idle_minutes = 3
# A fresh GPU pod restores the house state (57 GB, about 50 minutes) before its first batch; a
# warm one restores nothing (2026-10-29). Replaced once a day, not twice.
max_hours = 24
min_billed_hours = 0
disk_gb = 120
extra = { cloud_type = "SECURE", interruptible = false, cuda_versions = ["13.0"], gpu_types = ["NVIDIA L4", "NVIDIA RTX PRO 4000 Blackwell", "NVIDIA A40", "NVIDIA RTX A6000", "NVIDIA GeForce RTX 3090"] }

[hetzner]
ssh_keys = []
firewall_ids = []

# Given to every worker at boot, after its one-time token is redeemed. ``pass_env`` names
# variables copied from the controller's own environment (never written here). Deliberately
# absent: the Google Maps key (restricted Street View is never acquired in the cloud), the
# public bucket's write key (only the controller publishes), the contributor and launcher tokens.
[worker_env]
KERBSIDE_PRIVATE_STORE = "s3://${S3_PRIVATE_BUCKET}"
KERBSIDE_ROOT = "/app"
