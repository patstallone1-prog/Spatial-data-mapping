[project]
name = "smc"
version = "0.1.0"
description = "Spatial Mapping Crowdsource — fusion engine, capture, and simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    # Real feature detection and matching. SIFT (patent expired 2020) and ORB (BSD) are both
    # licence-clean, unlike the SuperPoint/SuperGlue pairing most tutorials reach for.
    "opencv-python-headless>=4.9",
    # Real photo loading: HEIC is the iPhone default and OpenCV cannot read it.
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
carla = ["carla>=0.9.15"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `value == pytest.approx(x)` is the documented pytest idiom, not a Yoda condition.
"tests/**" = ["SIM300"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
