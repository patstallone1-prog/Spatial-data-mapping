[project]
name = "smc"
version = "0.1.0"
description = "Spatial Mapping Crowdsource — fusion engine, capture, and simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    # Real feature detection and matching. SIFT (patent expired 2020) and ORB (BSD) are both
    # licence-clean, unlike the SuperPoint/SuperGlue pairing most tutorials reach for.
    #
    # Pinned below 5.0 deliberately: OpenCV 5 removed HOGDescriptor and ships no bundled Haar
    # cascades, which are what the on-device privacy filter uses. Its replacement (FaceDetectorYN)
    # needs a downloaded ONNX model, and this filter has to work offline on a phone.
    "opencv-python-headless>=4.9,<5",
    # Real photo loading: HEIC is the iPhone default and OpenCV cannot read it.
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "h3>=4.0",
    "pyarrow>=15.0",
    "duckdb>=1.1",
    "laspy[lazrs]>=2.5",
    # The system certificate bundle on macOS lacked a chain the city's open-data host serves.
    "certifi>=2024.2",
    # Kept-alive HTTPS for the lidar tiles: a new TLS handshake per 200 kB tile halved the rate.
    "urllib3>=1.26",
]

[project.optional-dependencies]
interiors = ["shapely>=2.1,<3", "trimesh>=4,<6"]
carla = ["carla>=0.9.15"]
# Calibration/sequence-cache tests exercise the optional photo-curb optimizer in CI.
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "scipy>=1.14"]
scan-build = ["trimesh==5.1.1", "scipy==1.18.1", "remotezip==0.12.6"]
reference-audit = ["indexed_gzip==1.10.3"]
# Windowed public COG ingestion; never download a national raster to build the Bay atlas.
nature = ["rasterio>=1.4,<2", "scipy>=1.14", "osmium>=4.1,<5"]
curb-photo = ["scipy>=1.14"]
photo-matching = [
    "scipy>=1.14", "torch>=2.8,<3", "torchvision>=0.23,<1",
    "kornia==0.8.3", "kornia-rs==0.1.9",
    "lightglue @ git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8",
]
# Uploading the nightly batch to Google Cloud Storage.
gcs = ["google-cloud-storage>=2.14"]
# The cloud controller and workers' object storage: Cloudflare R2 through its S3 API.
cloud = ["boto3>=1.34,<2"]
# The house pipeline's models (frontage pixel screen, detail detector, CLIP materials), pinned
# to what the local supervisor ran on 2026-10-18. The GPU image installs torch's CUDA build
# first (cloud/containers/gpu.Dockerfile); these pins then match it.
houses = ["torch==2.14.0", "torchvision==0.29.0", "transformers==5.16.1", "huggingface_hub==1.30.0",
          "safetensors==0.8.0", "tokenizers==0.23.2", "scipy>=1.14"]
# MegaLoc global descriptors. ~230M parameters; runs on MPS, CUDA or CPU.
learned = ["torch>=2.2", "torchvision>=0.17", "huggingface_hub>=0.23", "safetensors>=0.4"]

[project.scripts]
smc-cloud = "smc.cloud.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smc"]

[tool.hatch.metadata]
# The optional photo matcher is a reviewed, commit-pinned upstream dependency.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `value == pytest.approx(x)` is the documented pytest idiom, not a Yoda condition.
"tests/**" = ["SIM300"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_pwa_full_3d.py imports tools.build_pages from the repo root; `python -m pytest`
# put the cwd on the path by accident and the bare `pytest` CI runs did not.
pythonpath = ["."]
